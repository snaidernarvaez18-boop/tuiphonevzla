<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TuiPhone VZLA - Marketplace Certificado</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary-orange: #ff9900;
            --dark-bg: #131921;
            --dark-nav: #232f3e;
            --light-bg: #eaeded;
            --text-main: #0f1111;
            --text-muted: #565959;
            --border-color: #d5d9d9;
            --ebay-green: #86b817;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0; padding: 0;
            background-color: var(--light-bg);
            color: var(--text-main);
        }

        header {
            background-color: var(--dark-bg);
            color: white;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
            position: sticky; top: 0; z-index: 1000;
        }

        .brand-container {
            display: flex; align-items: center; gap: 10px; cursor: pointer;
        }

        .brand-logo {
            width: 38px; height: 38px;
            background: linear-gradient(135deg, var(--primary-orange), #e47911);
            border-radius: 8px; display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 1.2rem; color: white;
        }

        .brand-title { font-size: 1.4rem; font-weight: 800; margin: 0; }
        .brand-title span.phone { color: var(--primary-orange); }
        .brand-title span.vzla { color: var(--ebay-green); }

        .search-container {
            display: flex; flex-grow: 1; max-width: 500px; border-radius: 6px; overflow: hidden;
        }
        .search-container input { flex-grow: 1; border: none; padding: 10px 15px; outline: none; font-size: 0.95rem; }
        .btn-search { background-color: var(--primary-orange); border: none; padding: 0 15px; cursor: pointer; font-size: 1.1rem; }

        .header-actions { display: flex; gap: 10px; align-items: center; }
        .btn-action {
            background-color: #ffd814; color: #0f1111; border: 1px solid #fcd200;
            padding: 8px 14px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.9rem;
        }
        .btn-action:hover { background-color: #f7ca00; }

        .main-wrapper { max-width: 1300px; margin: 20px auto; padding: 0 20px; }

        .products-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px;
        }

        .product-card {
            background: white; border-radius: 8px; overflow: hidden; border: 1px solid var(--border-color);
            display: flex; flex-direction: column; transition: transform 0.2s;
        }
        .product-card:hover { transform: translateY(-4px); box-shadow: 0 8px 16px rgba(0,0,0,0.1); }

        .card-img { width: 100%; height: 200px; object-fit: cover; background: #f0f0f0; }
        .card-body { padding: 15px; display: flex; flex-direction: column; flex-grow: 1; }
        .card-title { font-size: 1rem; font-weight: 700; margin: 0 0 5px 0; }
        .card-specs { font-size: 0.82rem; color: var(--text-muted); margin-bottom: 6px; }
        .card-price { font-size: 1.3rem; font-weight: 800; color: #b12704; margin-top: auto; }
        .seller-info { font-size: 0.75rem; color: #555; margin-bottom: 8px; font-style: italic; }

        .card-buttons { display: flex; gap: 8px; margin-top: 10px; }
        .btn-card {
            flex: 1; padding: 8px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 0.85rem;
        }
        .btn-chat { background-color: #0066c0; color: white; }
        .btn-chat:hover { background-color: #004b91; }

        /* MODALES GENERALES */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); z-index: 2000; justify-content: center; align-items: center; padding: 15px;
        }
        .modal-content {
            background: #fff; width: 100%; max-width: 480px; border-radius: 8px; overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3); max-height: 90vh; display: flex; flex-direction: column;
        }
        .modal-header { background: var(--dark-bg); color: white; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
        .close-btn { background: none; border: none; color: white; font-size: 1.4rem; cursor: pointer; }
        .modal-body { padding: 20px; overflow-y: auto; }

        .form-row { margin-bottom: 12px; }
        .form-row label { display: block; margin-bottom: 4px; font-weight: 600; font-size: 0.85rem; }
        .form-row input, .form-row select, .form-row textarea {
            width: 100%; padding: 9px; border: 1px solid var(--border-color); border-radius: 4px; box-sizing: border-box; font-size: 0.9rem;
        }
        .btn-submit { background-color: var(--primary-orange); border: none; width: 100%; padding: 11px; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 5px; }

        /* CHAT STYLES */
        .chat-box { display: flex; flex-direction: column; height: 300px; border: 1px solid var(--border-color); border-radius: 4px; margin-bottom: 10px; background: #fafafa; }
        .chat-messages { flex-grow: 1; padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .chat-msg { background: #e2e8f0; padding: 6px 10px; border-radius: 6px; font-size: 0.85rem; max-width: 80%; }
        .chat-msg.me { background: #dcf8c6; align-self: flex-end; }
        .chat-input-row { display: flex; border-top: 1px solid var(--border-color); }
        .chat-input-row input { flex-grow: 1; border: none; padding: 10px; outline: none; font-size: 0.85rem; }
        .chat-input-row button { background: #0066c0; color: white; border: none; padding: 0 15px; cursor: pointer; font-weight: bold; }

        .status-box { font-size: 0.85rem; padding: 6px 12px; border-radius: 6px; margin-bottom: 15px; font-weight: bold; }
    </style>
</head>
<body>

<header>
    <div class="brand-container" onclick="window.location.reload()">
        <div class="brand-logo"></div>
        <h1 class="brand-title">Tui<span class="phone">Phone</span> <span class="vzla">VZLA</span></h1>
    </div>
    <div class="search-container">
        <input type="text" id="buscador" placeholder="Busca tu iPhone..." oninput="filtrarProductos()">
        <button class="btn-search" onclick="filtrarProductos()">🔍</button>
    </div>
    <div class="header-actions" id="user-menu-container">
        <!-- Renderizado dinámico según sesión -->
    </div>
</header>

<div class="main-wrapper">
    <div id="status" class="status-box" style="background: #e2e3e5; color: #383d41;">Conectando...</div>
    <div id="lista-items" class="products-grid"></div>
</div>

<!-- MODAL DE REGISTRO / LOGIN -->
<div id="modal-auth" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Registro de Usuario</h3>
            <button class="close-btn" onclick="cerrarAuth()">&times;</button>
        </div>
        <div class="modal-body">
            <div class="form-row"><label>Correo Gmail:</label><input type="email" id="auth-email" placeholder="tu-correo@gmail.com"></div>
            <div class="form-row"><label>Nombre:</label><input type="text" id="auth-nombre" placeholder="Tu nombre"></div>
            <div class="form-row"><label>Apellido:</label><input type="text" id="auth-apellido" placeholder="Tu apellido"></div>
            <div class="form-row"><label>Nombre de Usuario (Apodo):</label><input type="text" id="auth-username" placeholder="Ej: jose_iphones"></div>
            <button class="btn-submit" onclick="registrarUsuario()">Ingresar / Registrarse</button>
        </div>
    </div>
</div>

<!-- MODAL PUBLICAR -->
<div id="modal-publicar" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Publicar iPhone</h3>
            <button class="close-btn" onclick="cerrarPublicar()">&times;</button>
        </div>
        <div class="modal-body">
            <div class="form-row"><label>Modelo:</label><input type="text" id="p-model" placeholder="Ej: iPhone 13 Pro"></div>
            <div class="form-row"><label>Almacenamiento:</label><input type="text" id="p-storage" placeholder="Ej: 128GB"></div>
            <div class="form-row"><label>Batería:</label><input type="text" id="p-battery" placeholder="Ej: 90%"></div>
            <div class="form-row"><label>Precio ($):</label><input type="number" id="p-price" placeholder="350"></div>
            <div class="form-row"><label>Estado:</label><input type="text" id="p-state" placeholder="Ej: Impecable 10/10"></div>
            <div class="form-row"><label>Zona:</label><input type="text" id="p-zone" placeholder="Ej: Caracas"></div>
            <div class="form-row"><label>Detalles:</label><textarea id="p-details" rows="2"></textarea></div>
            <div class="form-row"><label>Foto del equipo:</label><input type="file" id="p-image" accept="image/*"></div>
            <button class="btn-submit" onclick="publicarIphone()">Confirmar Publicación</button>
        </div>
    </div>
</div>

<!-- MODAL CHAT -->
<div id="modal-chat" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="chat-title">Negociación</h3>
            <button class="close-btn" onclick="cerrarChat()">&times;</button>
        </div>
        <div class="modal-body" style="padding: 10px;">
            <div class="chat-box">
                <div id="chat-messages" class="chat-messages"></div>
                <div class="chat-input-row">
                    <input type="text" id="chat-input" placeholder="Escribe tu oferta o mensaje...">
                    <button onclick="enviarMensajeChat()">Enviar</button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- MODAL PANEL DE USUARIO -->
<div id="modal-panel" class="modal-overlay">
    <div class="modal-content" style="max-width: 600px;">
        <div class="modal-header">
            <h3>Mi Panel de Publicaciones</h3>
            <button class="close-btn" onclick="cerrarPanel()">&times;</button>
        </div>
        <div class="modal-body">
            <div id="mis-publicaciones-lista"></div>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://vwepjlfhnmrvbduxgqgr.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_BoA_BZpAahdFaKe2334ixQ_pxgfEmRt';
    const { createClient } = supabase;
    const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let cacheProductos = [];
    let usuarioActual = JSON.parse(localStorage.getItem('tui_user')) || null;
    let chatIphoneIdActual = null;

    function actualizarMenuHeader() {
        const container = document.getElementById('user-menu-container');
        if (usuarioActual) {
            container.innerHTML = `
                <span style="font-size:0.85rem; color:#ccc;">Hola, <b>@${usuarioActual.username}</b></span>
                <button class="btn-action" onclick="abrirPublicar()">+ Vender</button>
                <button class="btn-action" style="background:#232f3e; color:white; border-color:#555;" onclick="abrirPanel()">Mi Panel</button>
                <button class="btn-action" style="background:#b12704; color:white;" onclick="cerrarSesion()">Salir</button>
            `;
        } else {
            container.innerHTML = `
                <button class="btn-action" onclick="abrirAuth()">Registrarse / Iniciar Sesión</button>
            `;
        }
    }

    function abrirAuth() { document.getElementById('modal-auth').style.display = 'flex'; }
    function cerrarAuth() { document.getElementById('modal-auth').style.display = 'none'; }
    function abrirPublicar() {
        if (!usuarioActual) { alert('Debes registrarte primero.'); abrirAuth(); return; }
        document.getElementById('modal-publicar').style.display = 'flex';
    }
    function cerrarPublicar() { document.getElementById('modal-publicar').style.display = 'none'; }
    function cerrarChat() { document.getElementById('modal-chat').style.display = 'none'; }
    function abrirPanel() { cargarMisPublicaciones(); document.getElementById('modal-panel').style.display = 'flex'; }
    function cerrarPanel() { document.getElementById('modal-panel').style.display = 'none'; }
    function cerrarSesion() { localStorage.removeItem('tui_user'); usuarioActual = null; actualizarMenuHeader(); }

    async function registrarUsuario() {
        const email = document.getElementById('auth-email').value.trim();
        const nombre = document.getElementById('auth-nombre').value.trim();
        const apellido = document.getElementById('auth-apellido').value.trim();
        const username = document.getElementById('auth-username').value.trim();

        if (!email || !nombre || !apellido || !username) {
            alert('Completa todos los campos obligatorios.'); return;
        }

        usuarioActual = { email, nombre, apellido, username };
        localStorage.setItem('tui_user', JSON.stringify(usuarioActual));
        cerrarAuth();
        actualizarMenuHeader();
        alert('¡Bienvenido, ' + username + '!');
    }

    async function cargarDatos() {
        const statusEl = document.getElementById('status');
        try {
            const { data, error } = await _supabase.from('iphone').select('*');
            if (error) throw error;
            statusEl.textContent = 'Conectado a Supabase exitosamente ✅';
            statusEl.style.background = '#d4edda'; statusEl.style.color = '#155724';
            cacheProductos = data || [];
            filtrarProductos();
        } catch (err) {
            statusEl.textContent = 'Error al cargar datos.';
            statusEl.style.background = '#f8d7da'; statusEl.style.color = '#721c24';
        }
    }

    function filtrarProductos() {
        const query = document.getElementById('buscador').value.toLowerCase();
        const filtrados = cacheProductos.filter(i => (i.model || '').toLowerCase().includes(query));
        renderizarGrilla(filtrados);
    }

    function renderizarGrilla(data) {
        const lista = document.getElementById('lista-items');
        lista.innerHTML = '';
        if (data.length === 0) {
            lista.innerHTML = '<p>No hay iPhones publicados.</p>'; return;
        }
        data.forEach(item => {
            const card = document.createElement('div');
            card.className = 'product-card';
            card.innerHTML = `
                <img class="card-img" src="${item.image_url || ''}" onerror="this.src='https://via.placeholder.com/280x200?text=Sin+Imagen'">
                <div class="card-body">
                    <h3 class="card-title">${item.model || ''} - ${item.storage || ''}</h3>
                    <div class="card-specs">🔋 ${item.battery || 'N/A'} | 📍 ${item.zone || ''}</div>
                    <div class="seller-info">Publicado por: @${item.user_email ? item.user_email.split('@')[0] : 'anónimo'}</div>
                    <div class="card-price">$${item.price || 0}</div>
                    <div class="card-buttons">
                        <button class="btn-card btn-chat" onclick="abrirChat(${item.id}, '${item.model}')">💬 Chat / Negociar</button>
                    </div>
                </div>
            `;
            lista.appendChild(card);
        });
    }

    async function publicarIphone() {
        const model = document.getElementById('p-model').value;
        const storage = document.getElementById('p-storage').value;
        const battery = document.getElementById('p-battery').value;
        const price = document.getElementById('p-price').value;
        const state = document.getElementById('p-state').value;
        const zone = document.getElementById('p-zone').value;
        const details = document.getElementById('p-details').value;
        const fileInput = document.getElementById('p-image');

        if (!price) { alert('Ingresa un precio.'); return; }

        const guardar = async (imgBase64) => {
            const { error } = await _supabase.from('iphone').insert([{
                model, storage, battery, price, state, zone, details,
                image_url: imgBase64,
                user_email: usuarioActual.email
            }]);
            if (error) alert('Error: ' + error.message);
            else {
                alert('¡Publicado con éxito!');
                cerrarPublicar();
                cargarDatos();
            }
        };

        if (fileInput.files && fileInput.files[0]) {
            const reader = new FileReader();
            reader.onload = e => guardar(e.target.result);
            reader.readAsDataURL(fileInput.files[0]);
        } else {
            guardar('');
        }
    }

    // GESTIÓN DEL CHAT POR PUBLICACIÓN
    async function abrirChat(iphoneId, modelo) {
        if (!usuarioActual) { alert('Inicia sesión para chatear.'); abrirAuth(); return; }
        chatIphoneIdActual = iphoneId;
        document.getElementById('chat-title').textContent = `Negociación: ${modelo}`;
        document.getElementById('modal-chat').style.display = 'flex';
        cargarMensajesChat();
    }

    async function cargarMensajesChat() {
        const container = document.getElementById('chat-messages');
        container.innerHTML = 'Cargando chat...';
        const { data, error } = await _supabase
            .from('messages')
            .select('*')
            .eq('iphone_id', chatIphoneIdActual)
            .order('created_at', { ascending: true });

        container.innerHTML = '';
        if (error || !data || data.length === 0) {
            container.innerHTML = '<p style="color:#888; font-size:0.8rem; text-align:center;">No hay mensajes aún. ¡Inicia la conversación!</p>';
            return;
        }

        data.forEach(m => {
            const div = document.createElement('div');
            div.className = `chat-msg ${m.remitente === usuarioActual.username ? 'me' : ''}`;
            div.innerHTML = `<b>@${m.remitente}:</b> ${m.mensaje}`;
            container.appendChild(div);
        });
        container.scrollTop = container.scrollHeight;
    }

    async function enviarMensajeChat() {
        const input = document.getElementById('chat-input');
        const mensaje = input.value.trim();
        if (!mensaje) return;

        const { error } = await _supabase.from('messages').insert([{
            iphone_id: chatIphoneIdActual,
            remitente: usuarioActual.username,
            mensaje: mensaje
        }]);

        if (!error) {
            input.value = '';
            cargarMensajesChat();
        }
    }

    // PANEL PERSONAL
    async function cargarMisPublicaciones() {
        const container = document.getElementById('mis-publicaciones-lista');
        container.innerHTML = 'Cargando tus publicaciones...';
        const { data, error } = await _supabase
            .from('iphone')
            .select('*')
            .eq('user_email', usuarioActual.email);

        if (error || !data || data.length === 0) {
            container.innerHTML = '<p>No tienes publicaciones activas.</p>';
            return;
        }

        container.innerHTML = '';
        data.forEach(item => {
            const div = document.createElement('div');
            div.style.cssText = "display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #ddd; padding:10px 0;";
            div.innerHTML = `
                <div><b>${item.model}</b> - $${item.price}</div>
                <button class="btn-action" style="background:#b12704; color:white; padding:5px 10px;" onclick="eliminarPublicacion(${item.id})">Eliminar</button>
            `;
            container.appendChild(div);
        });
    }

    async function eliminarPublicacion(id) {
        if (!confirm('¿Seguro que deseas eliminar este anuncio?')) return;
        const { error } = await _supabase.from('iphone').delete().eq('id', id);
        if (!error) {
            alert('Anuncio eliminado.');
            cargarMisPublicaciones();
            cargarDatos();
        } else {
            alert('Error al eliminar: ' + error.message);
        }
    }

    actualizarMenuHeader();
    cargarDatos();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TuiPhone VZLA - Marketplace de iPhones</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SDK de Supabase para conectar al servidor en la nube -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen pb-12">

    <!-- Header -->
    <header class="bg-white shadow-sm border-b p-4 max-w-6xl mx-auto rounded-b-xl flex justify-between items-center">
        <h1 class="text-xl font-extrabold text-blue-600 cursor-pointer" onclick="cambiarVista('catalogo')">📱 TuiPhone VZLA</h1>
        <button onclick="cambiarVista('formulario')" id="btnToggle" class="bg-blue-600 text-white px-4 py-2 rounded-lg font-medium shadow hover:bg-blue-700 transition">
            + Publicar iPhone
        </button>
    </header>

    <main class="max-w-6xl mx-auto p-4 mt-6">

        <!-- VISTA 1: CATÁLOGO Y FILTROS -->
        <section id="seccionCatalogo">
            <div class="mb-6">
                <h2 class="text-xl font-bold mb-2">Filtrar por Estado en Venezuela</h2>
                <div id="contenedorFiltros" class="flex gap-2 overflow-x-auto pb-2">
                    <button onclick="filtrarUbicacion('TODOS')" class="filtro-btn px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap bg-blue-600 text-white shadow">🌍 Todo el país</button>
                </div>
            </div>

            <div id="gridProductos" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                <p class="col-span-3 text-center text-gray-500 py-8">Cargando iPhones desde el servidor...</p>
            </div>
        </section>

        <!-- VISTA 2: FORMULARIO DE PUBLICACIÓN CON FOTO Y SERVIDOR -->
        <section id="seccionFormulario" class="hidden max-w-xl mx-auto bg-white p-6 shadow-md rounded-xl border">
            <h2 class="text-2xl font-bold mb-4">Publica tu iPhone en el Servidor</h2>
            <form onsubmit="publicarEnServidor(event)" class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium">Modelo</label>
                        <select id="inputModel" class="w-full border rounded p-2 mt-1">
                            <option>iPhone 11</option>
                            <option>iPhone 12</option>
                            <option>iPhone 13</option>
                            <option>iPhone 13 Pro Max</option>
                            <option>iPhone 14 Pro</option>
                            <option>iPhone 15 Pro Max</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium">Capacidad</label>
                        <select id="inputStorage" class="w-full border rounded p-2 mt-1">
                            <option>64GB</option>
                            <option>128GB</option>
                            <option>256GB</option>
                            <option>512GB</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium">Salud de Batería (%)</label>
                        <input type="number" id="inputBattery" placeholder="Ej: 88" class="w-full border rounded p-2 mt-1" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium">Precio ($ USD)</label>
                        <input type="number" id="inputPrice" placeholder="Ej: 350" class="w-full border rounded p-2 mt-1" required>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium">Estado</label>
                        <select id="inputState" class="w-full border rounded p-2 mt-1"></select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium">Zona / Municipio</label>
                        <input type="text" id="inputZone" placeholder="Ej: Chacao, El Viñedo" class="w-full border rounded p-2 mt-1" required>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium">Foto real del iPhone</label>
                    <input type="file" id="inputImage" accept="image/*" class="w-full border rounded p-2 mt-1 bg-gray-50" required>
                    <p class="text-xs text-gray-500 mt-1">Sube una foto clara tomada desde tu teléfono.</p>
                </div>

                <div>
                    <label class="block text-sm font-medium">Detalles específicos</label>
                    <textarea id="inputDetails" rows="3" placeholder="Ej: Libre de fábrica, Face ID activo..." class="w-full border rounded p-2 mt-1" required></textarea>
                </div>

                <button type="submit" id="btnSubmit" class="w-full bg-green-600 text-white py-3 rounded-lg font-bold hover:bg-green-700 transition">
                    Subir al Servidor
                </button>
            </form>
        </section>

    </main>

    <!-- Script de Conexión Real con Supabase -->
    <script>
        // =========================================================================
        // 🔑 CREDENCIALES OFICIALES DE SUPABASE
        // =========================================================================
        const SUPABASE_URL = 'https://wvepjlhnmrvbduxgqgr.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_BoA_BZpAahdFaKe2334ixQ_pxgfEmRt';
        // =========================================================================

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const estadosVenezuela = [
            "Amazonas", "Anzoátegui", "Apure", "Aragua", "Barinas", "Bolívar", 
            "Carabobo", "Cojedes", "Delta Amacuro", "Distrito Capital", "Falcón", 
            "Guárico", "Lara", "Mérida", "Miranda", "Monagas", "Nueva Esparta", 
            "Portuguesa", "Sucre", "Táchira", "Trujillo", "La Guaira", "Yaracuy", "Zulia"
        ];

        document.addEventListener("DOMContentLoaded", () => {
            const selectState = document.getElementById('inputState');
            const contenedorFiltros = document.getElementById('contenedorFiltros');

            estadosVenezuela.forEach(estado => {
                const opt = document.createElement('option');
                opt.value = estado;
                opt.innerText = estado;
                selectState.appendChild(opt);

                const btn = document.createElement('button');
                btn.onclick = () => cargarProductos(estado);
                btn.className = "filtro-btn px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap bg-white text-gray-700 border hover:bg-gray-100";
                btn.innerText = `📍 ${estado}`;
                contenedorFiltros.appendChild(btn);
            });

            cargarProductos();
        });

        function cambiarVista(vista) {
            const cat = document.getElementById('seccionCatalogo');
            const form = document.getElementById('seccionFormulario');
            const btn = document.getElementById('btnToggle');

            if (vista === 'formulario') {
                cat.classList.add('hidden');
                form.classList.remove('hidden');
                btn.innerText = '← Ver Catálogo';
                btn.className = 'bg-gray-600 text-white px-4 py-2 rounded-lg font-medium shadow hover:bg-gray-700 transition';
            } else {
                form.classList.add('hidden');
                cat.classList.remove('hidden');
                btn.innerText = '+ Publicar iPhone';
                btn.className = 'bg-blue-600 text-white px-4 py-2 rounded-lg font-medium shadow hover:bg-blue-700 transition';
                cargarProductos();
            }
        }

        // Subir imagen al servicio de alojamiento temporal para generar el enlace
        async function subirImagenCloud(file) {
            const dataImg = new FormData();
            dataImg.append('image', file);
            
            try {
                const res = await fetch('https://api.imgbb.com/1/upload?key=d495201d41873919e59ca3226db861d8', {
                    method: 'POST',
                    body: dataImg
                });
                const json = await res.json();
                if(json.success) return json.data.url;
            } catch (e) {
                console.error("Error subiendo imagen", e);
            }
            return 'https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=500';
        }

        async function publicarEnServidor(event) {
            event.preventDefault();
            const btn = document.getElementById('btnSubmit');
            btn.innerText = "Subiendo imagen y guardando...";
            btn.disabled = true;

            const fileInput = document.getElementById('inputImage').files[0];
            const imageUrl = await subirImagenCloud(fileInput);

            const nuevoiPhone = {
                model: document.getElementById('inputModel').value,
                storage: document.getElementById('inputStorage').value,
                battery: document.getElementById('inputBattery').value,
                price: document.getElementById('inputPrice').value,
                state: document.getElementById('inputState').value,
                zone: document.getElementById('inputZone').value,
                details: document.getElementById('inputDetails').value,
                image_url: imageUrl
            };

            // Guardando en la tabla 'iphone' de tu Supabase
            const { error } = await supabaseClient.from('iphone').insert([nuevoiPhone]);

            if (error) {
                alert('Error al guardar en el servidor: ' + error.message);
                btn.innerText = "Subir al Servidor";
                btn.disabled = false;
            } else {
                alert('¡iPhone publicado exitosamente en el servidor en la nube!');
                document.querySelector('form').reset();
                cambiarVista('catalogo');
            }
        }

        async function cargarProductos(filtroEstado = 'TODOS') {
            const grid = document.getElementById('gridProductos');
            grid.innerHTML = `<p class="col-span-3 text-center text-gray-500 py-8">Buscando equipos en el servidor...</p>`;

            let query = supabaseClient.from('iphone').select('*').order('id', { ascending: false });
            
            if (filtroEstado !== 'TODOS') {
                query = query.eq('state', filtroEstado);
            }

            const { data: iphones, error } = await query;

            if (error) {
                grid.innerHTML = `<p class="col-span-3 text-center text-red-500 py-8">Error cargando datos del servidor.</p>`;
                return;
            }

            if (!iphones || iphones.length === 0) {
                grid.innerHTML = `<p class="col-span-3 text-center text-gray-500 py-8">No hay iPhones publicados todavía.</p>`;
                return;
            }

            grid.innerHTML = '';
            iphones.forEach(iphone => {
                const card = document.createElement('div');
                card.className = "bg-white border rounded-xl overflow-hidden shadow-sm producto-card";
                card.innerHTML = `
                    <img src="${iphone.image_url}" alt="iPhone" class="w-full h-48 object-cover bg-gray-100">
                    <div class="p-4">
                        <span class="text-xs bg-blue-100 text-blue-800 px-2 py-1 rounded font-semibold">📍 ${iphone.state} (${iphone.zone})</span>
                        <h3 class="font-bold text-lg mt-2">${iphone.model} - ${iphone.storage}</h3>
                        <p class="text-gray-600 text-sm">Batería: ${iphone.battery}% | Libre de fábrica</p>
                        <p class="text-xs text-gray-500 mt-1">${iphone.details}</p>
                        <div class="flex justify-between items-center mt-4">
                            <span class="text-2xl font-extrabold text-green-600">$${iphone.price}</span>
                            <button onclick="alert('Abriendo chat interno con el vendedor de ${iphone.state}...')" class="bg-blue-50 text-blue-600 border border-blue-200 px-3 py-1.5 rounded-lg text-sm font-medium hover:bg-blue-600 hover:text-white transition">
                                💬 Enviar Mensaje
                            </button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }
    </script>
</body>
</html>
